# ==============================================================================
# InternetNZ Standard Gitleaks Configuration
# Reference: pre-commit-secret-scanning-proposal.md
# ==============================================================================
# Exception Hierarchy:
#  - Tier 1: Inline directive on line: '# gitleaks:allow'
#  - Tier 2: Fingerprint suppression: .gitleaksignore
#  - Tier 3: Repository-level allowlist (paths and regexes below)
# ==============================================================================

[allowlist]
description = "InternetNZ baseline allowlist"
paths = [
  '''(?i)(^|/)tests?/.*fixtures/''',
  '''(?i)(^|/)\.env\.example$''',
  '''(?i)package-lock\.json$''',
  '''(?i)go\.sum$''',
]
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''', # AWS standard documentation dummy key
]
